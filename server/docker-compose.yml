version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: anarchy-codex-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: anarchy-codex
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - anarchy-codex-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB Express (Optional - for database management)
  mongo-express:
    image: mongo-express:1.0.0
    container_name: anarchy-codex-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password123
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - anarchy-codex-network
    profiles:
      - dev

  # Database Seeding Service
  db-seed:
    build:
      context: .
      dockerfile: Dockerfile.seed
    container_name: anarchy-codex-db-seed
    environment:
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/anarchy-codex?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - anarchy-codex-network
    profiles:
      - seed
      - dev
    restart: "no"

  # Anarchy Codex API
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: anarchy-codex-api
    restart: unless-stopped
    environment:
      # Database
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/anarchy-codex?authSource=admin
      
      # JWT Configuration
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      
      # Application
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: http://localhost:3000
      
      # File Upload
      UPLOAD_DEST: ./uploads
      MAX_FILE_SIZE: 10485760
    ports:
      - "3001:3001"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - anarchy-codex-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: anarchy-codex-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - anarchy-codex-network
    profiles:
      - production

volumes:
  mongodb_data:
    driver: local
  uploads_data:
    driver: local

networks:
  anarchy-codex-network:
    driver: bridge 