version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: anarchy-codex-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: anarchy-codex
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_dev:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - anarchy-codex-network-dev

  # MongoDB Express (for development)
  mongo-express:
    image: mongo-express:1.0.0
    container_name: anarchy-codex-mongo-express-dev
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password123
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    networks:
      - anarchy-codex-network-dev

  # Anarchy Codex API (Development)
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: anarchy-codex-api-dev
    restart: unless-stopped
    environment:
      # Database
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/anarchy-codex?authSource=admin
      
      # JWT Configuration
      JWT_SECRET: dev-jwt-secret-key
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      
      # Application
      PORT: 3001
      NODE_ENV: development
      FRONTEND_URL: http://localhost:3000
      
      # File Upload
      UPLOAD_DEST: ./uploads
      MAX_FILE_SIZE: 10485760
    ports:
      - "3001:3001"
      - "9229:9229"  # Debug port
    volumes:
      - .:/app
      - /app/node_modules
      - uploads_data_dev:/app/uploads
    depends_on:
      - mongodb
    networks:
      - anarchy-codex-network-dev
    command: npm run start:dev

volumes:
  mongodb_data_dev:
    driver: local
  uploads_data_dev:
    driver: local

networks:
  anarchy-codex-network-dev:
    driver: bridge 